version: '3.8'

services:
  app:
    image: ghcr.io/az2oo1/bina-and-edarah:latest
    container_name: bina_edarah_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Mode Selection:
      # - DEV MODE (DEV_MODE=true or NODE_ENV=development): Uses in-site notification dialog for OTP, skips Authentica SMS.
      # - PRODUCTION MODE (NODE_ENV=production): Uses Authentica SMS Gateway, sends verification code to phone only.
      - NODE_ENV=${NODE_ENV:-production}
      - APP_ENV=${APP_ENV:-production}
      - DEV_MODE=${DEV_MODE:-false}
      - DATABASE_URL=postgresql://root@cockroach_db:26257/bina_db?sslmode=disable
      - S3_ENDPOINT=http://rustfs-storage:9000
      - S3_BUCKET=bina-assets
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-rustfsaccesskey}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-rustfssecretkey}
      - S3_REGION=${S3_REGION:-us-east-1}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-bina-edara-jwt-secret-key-1337}
      - AUTHENTICA_API_KEY=${AUTHENTICA_API_KEY:-$2y$10$qtRuMVdslBE8aQDUvWoiJuPYCRYt/mw95knxkg5d9WfnfYcZrKrSG}
      - AUTHENTICA_ENABLED=${AUTHENTICA_ENABLED:-true}
      - AUTHENTICA_METHOD=${AUTHENTICA_METHOD:-sms}
    volumes:
      - app_data:/data
      - uploads_data:/app/uploads
    depends_on:
      cockroach_db:
        condition: service_healthy
      rustfs-storage:
        condition: service_started

  cockroach_db:
    image: cockroachdb/cockroach:v24.1.3
    container_name: cockroach_db
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /cockroach/cockroach start-single-node --insecure --http-addr=0.0.0.0:8080 &
        until /cockroach/cockroach sql --insecure --execute="SELECT 1" >/dev/null 2>&1; do sleep 1; done &&
        /cockroach/cockroach sql --insecure --execute="CREATE DATABASE IF NOT EXISTS bina_db;" &&
        wait
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  rustfs-storage:
    image: rustfs/rustfs:latest
    container_name: rustfs-storage
    restart: unless-stopped
    user: "0:0"
    command: /data
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY:-rustfsaccesskey}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY:-rustfssecretkey}
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_OBS_LOGGER_LEVEL=error
      - RUSTFS_OBS_LOG_DIRECTORY=/var/log/rustfs/
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

volumes:
  app_data: {}
  uploads_data: {}
  cockroach_data: {}
  rustfs_data: {}
